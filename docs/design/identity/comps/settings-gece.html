<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Plith settings Gece</title>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&family=Public+Sans:wght@400;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2A2C30; padding: 32px; display: flex; flex-direction: column; gap: 32px; width: 904px; }
  .win svg { display: block; }
  .win { box-shadow: 0 0 0 1px #3A3A3A; }
  .note { font: 400 10px "Martian Mono", monospace; letter-spacing: .06em; color: #A39E94; margin-bottom: -20px; }
</style>
</head>
<body>
<script src="icons.js"></script>
<script src="kit.js"></script>
<script src="settings.js"></script>
<script>
// Gece: OSD with the interlock (13 normal, 14 locked), OSD with 13 pulled, Genel, Boşta.
function note(t) { const d = document.createElement('div'); d.className = 'note'; d.textContent = t; document.body.appendChild(d); }
whenFonts(() => {
  note('OSD · 13 NORMAL, 14 KİLİTLİ');
  settingsWindow('gece', 'osd');
  note('OSD · 13 ÇEKİLİ, 14 SERBEST');
  settingsWindow('gece', 'osd', { osdOn: true, suffix: '-serbest' });
  note('GENEL · 2 NUMARALI KOLDA KLAVYE ODAĞI');
  settingsWindow('gece', 'genel');
  note('BOŞTA · 11 KİLİTLİ: KONUM ŞEHİR DEĞİL');
  settingsWindow('gece', 'bosta');
  note('BOŞTA · SONA KAYDIRILMIŞ');
  settingsWindow('gece', 'bosta', { scroll: 'end', suffix: '-sonu' });
});
</script>
</body>
</html>
