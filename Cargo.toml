[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/berkeerdo/Plith"

[workspace.dependencies]
windows = "0.62.2"
windows-future = "0.3.2"
plith-core = { path = "crates/plith-core" }
plith-render = { path = "crates/plith-render" }
plith-shell = { path = "crates/plith-shell" }
plith-audio = { path = "crates/plith-audio" }
plith-media = { path = "crates/plith-media" }
plith-system = { path = "crates/plith-system" }
plith-ipc = { path = "crates/plith-ipc" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
mod_module_files = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
