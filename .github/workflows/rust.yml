name: Rust

# Lint, test and structure checks for the Rust workspace. Scoped to the Rust tree and the
# checks themselves, so a change to the frozen WPF app does not run it and a change to a check
# always does. The two path lists are kept identical by hand.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'scripts/structure-check.mjs'
      - 'scripts/check-deps.mjs'
      - 'scripts/check-deps.test.mjs'
      - 'structure-baseline.json'
      - '.github/workflows/rust.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'scripts/structure-check.mjs'
      - 'scripts/check-deps.mjs'
      - 'scripts/check-deps.test.mjs'
      - 'structure-baseline.json'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Structure check
        run: node scripts/structure-check.mjs

      - name: Dependency rules
        run: |
          node --test scripts/check-deps.test.mjs
          node scripts/check-deps.mjs
