name: Accessibility check

# Runs scripts/check-a11y.ps1 so an interactive XAML control that loses its
# AutomationProperties.Name fails CI instead of shipping silently. Scoped to -Root src
# so both Plith and Plith.Installer stay covered.

on:
  pull_request:
    paths:
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'src/**'

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run accessibility check
        run: pwsh -NoProfile -File scripts/check-a11y.ps1 -Root src
