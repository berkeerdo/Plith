[package]
name = "plith-audio"
description = "Audio services: the Voicemeeter Remote API, Windows Core Audio endpoints, endpoint pinning and mic mute."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The `#[implement]` macro expands to `::windows_core` paths, so the crate must be a direct
# dependency. Same version `windows` already resolves to.
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[lints]
workspace = true

[[example]]
name = "verify_audio_writes"
path = "examples/verify_writes.rs"
test = true
