[package]
name = "plith-media"
description = "Media services: SMTC sessions, seek and the data behind the output picker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Names `IAsyncOperation` and its completion handler, which `windows` does not re-export. Same
# version `windows` already resolves to.
windows-future = { workspace = true }
windows = { workspace = true, features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_Console",
] }

[lints]
workspace = true

[[example]]
name = "verify_media_writes"
path = "examples/verify_media_writes.rs"
test = true
