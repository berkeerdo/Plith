[package]
name = "plith-shell"
description = "The notch window: hit testing, input, hover, topmost handling, fullscreen detection, OLE drag and drop and the tray."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plith-core.workspace = true
# The `#[implement]` macro expands to `::windows_core` paths, so the crate must be a direct
# dependency. Same version `windows` already resolves to.
windows-core = { workspace = true }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
