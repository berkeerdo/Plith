[package]
name = "plith-setup"
description = "The Plith installer: one exe that carries the app and its helper, and installs, repairs, updates and removes them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plith-core.workspace = true
plith-host.workspace = true
plith-ipc.workspace = true
plith-media.workspace = true
plith-render.workspace = true
plith-shell.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Pinned exactly: the build script embeds the icon and the version resource through it.
# `default-features = false` drops the `toml` parser; the strings come from Cargo's env vars.
[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[lints]
workspace = true
